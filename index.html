<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỏi thật một câu 🤫</title>
    <!-- Thư viện hiệu ứng pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #1c1e21;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 50px;
            position: relative;
        }

        button {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        #yes-btn {
            background-color: #0084ff;
            color: white;
        }

        #yes-btn:hover {
            transform: scale(1.05);
            background-color: #0073e6;
        }

        #no-btn {
            background-color: #e4e6eb;
            color: #050505;
            position: absolute;
            z-index: 99;
        }

        /* Giao diện kết quả */
        .result {
            display: none;
        }

        .result img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .result p {
            font-size: 18px;
            color: #333;
            font-weight: 500;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Màn hình câu hỏi -->
    <div class="card" id="quiz-card">
        <h1>Bạn có phải là gay không? 👀</h1>
        <div class="btn-container">
            <button id="yes-btn" onclick="showResult()">Phải 👍</button>
            <button id="no-btn" onmouseover="escapeBtn()" onclick="escapeBtn()" ontouchstart="escapeBtn()">Không 👎</button>
        </div>
    </div>

    <!-- Màn hình kết quả -->
    <div class="card result" id="result-card">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z0ZjB4eTZxdnhyc2x2YmRhYXF0emVuaDZ3NWxibWR1N3RxeWZzdyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ggDy5NyLc8iy4/giphy.gif" alt="Meme">
        <h1>Thành thật đấy! 😂</h1>
        <p>Cảm ơn bạn đã hợp tác trả lời thành thật nha.</p>
    </div>

    <script>
        // Hàm làm cho nút "Không" tự động né khi chuột rê đến hoặc ngón tay chạm vào
        function escapeBtn() {
            const noBtn = document.getElementById('no-btn');
            
            const padding = 60;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Xử lý khi nhấn nút "Phải"
        function showResult() {
            document.getElementById('quiz-card').style.display = 'none';
            document.getElementById('result-card').style.display = 'block';

            // Bắn một chút pháo hoa mừng sự thành thật
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
